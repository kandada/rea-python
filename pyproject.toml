[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-mcp"
version = "0.1.5"
description = "rea-mcp - reverse engineer anything from your terminal or agent, with one CLI and MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "rea-mcp contributors" }]
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "agents",
    "cli",
    "mcp-server",
    "model-context-protocol",
    "static-analysis",
    "rea-python",
    "rea_mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
rea-mcp = "rea_mcp.main.entry:cli_main"
rea-python = "rea_mcp.main.entry:cli_main"
rea = "rea_mcp.main.entry:cli_main"

[project.urls]
Homepage = "https://github.com/kandada/rea-python"
Repository = "https://github.com/kandada/rea-python.git"
Issues = "https://github.com/kandada/rea-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rea*"]
exclude = ["rea_mcp.tests*", "tests*"]

[tool.setuptools.package-data]
rea_mcp = ["py.typed", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]
markers = [
    "domain: pure domain unit tests",
    "contracts: schema contract tests",
    "providers: provider adapter tests",
    "application: application workflow tests",
    "boundary: single production boundary tests",
    "mcp: MCP transport and tool contract tests",
    "acceptance: compiled CLI/MCP journey tests",
    "slow: slow or toolchain-dependent tests",
    "real_engine: requires a real external engine (named skip when absent)",
]

[tool.coverage.run]
branch = true
source = ["rea_mcp"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["rea_mcp"]

# Optional engines are imported lazily and are not hard dependencies. Their
# absence must not fail type-checking on any host.
[[tool.mypy.overrides]]
module = [
    "playwright",
    "playwright.*",
    "frida",
    "rzpipe",
    "evmole",
    "pyhidra",
    "ghidra.*",
    "mitmproxy",
    "mitmproxy.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vendor", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "B008"]
