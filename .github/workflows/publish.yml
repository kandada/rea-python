name: Publish

# Publishes to PyPI via Trusted Publishing when a GitHub Release is published
# (or on manual dispatch). Configure the trusted publisher on PyPI first:
#   https://docs.pypi.org/trusted-publishers/
# Project: rea-mcp | Workflow: publish.yml | Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify artifacts
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "rea_mcp/__init__.py" in names
          assert "rea/__init__.py" in names
          assert "rea_python/__init__.py" in names
          print("ok:", wheel)
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
